name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release tagged v<appinfo version> from this commit'
        type: boolean
        default: false

permissions:
  contents: read

env:
  OOKLA_URL: https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-linux-armel.tgz
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain (static musl targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf,aarch64-unknown-linux-musl,x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ptyrun

      - name: Install JS dependencies
        run: |
          npm ci
          npm install --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Build ptyrun helpers (armv7, aarch64, x86_64)
        run: npm run build:pty

      - name: Fetch official Ookla armel build for tests (not packaged)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
          mkdir -p "$RUNNER_TEMP/ookla"
          curl -fsSL "$OOKLA_URL" | tar -xz -C "$RUNNER_TEMP/ookla" speedtest
          qemu-arm-static "$RUNNER_TEMP/ookla/speedtest" --version | head -1

      - name: Test (mock CLI, service, UI end-to-end, official binary under QEMU)
        env:
          OOKLA_ARMEL_BIN: ${{ runner.temp }}/ookla/speedtest
          QEMU_ARM: /usr/bin/qemu-arm-static
          REAL_DOWNLOAD: '1'
        run: npm test

      - name: Release tag
        id: version
        run: |
          v=$(node -p "require('./app/appinfo.json').version")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != appinfo $v"; exit 1; }
          fi

      - name: Package .ipk
        run: |
          npm run package
          cd dist && sha256sum *.ipk > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: |
            dist/*.ipk
            dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/
          if-no-files-found: ignore

  release:
    # A pushed v* tag, or a manual run with "release" ticked (creates the tag).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # main hosts the Homebrew Channel repository index (homebrew/apps.json)
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: ipk
          path: dist

      - name: Generate Homebrew Channel repository files
        run: node scripts/make-homebrew-repo.js dist/*.ipk "${{ needs.build.outputs.tag }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Speedtest CLI ${{ needs.build.outputs.tag }}
          files: |
            dist/*.ipk
            dist/SHA256SUMS
            homebrew/*.manifest.json
          generate_release_notes: true
          body: |
            **Homebrew Channel:** Settings → Add repository →
            `https://raw.githubusercontent.com/danzig666/webos-speedtest/main/homebrew/apps.json`

            Or install the .ipk with `ares-install` or over SSH (see README). The Ookla CLI is **not** included:
            on first start the app elevates its service through Homebrew Channel, downloads the official
            CLI (SHA-256 pinned), and then shows Ookla's terms for you to accept.

      # Only after the release assets exist, so the index never points at a missing ipk.
      - name: Publish the repository index on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homebrew
          if git diff --cached --quiet; then echo "index unchanged"; exit 0; fi
          git commit -m "Homebrew repository: ${{ needs.build.outputs.tag }}"
          git push origin HEAD:main
