name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OOKLA_URL: https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-linux-armel.tgz
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain (static musl targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf,aarch64-unknown-linux-musl,x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ptyrun

      - name: Install JS dependencies
        run: |
          npm ci
          npm install --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Build ptyrun helpers (armv7, aarch64, x86_64)
        run: npm run build:pty

      - name: Fetch official Ookla armel build for tests (not packaged)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
          mkdir -p "$RUNNER_TEMP/ookla"
          curl -fsSL "$OOKLA_URL" | tar -xz -C "$RUNNER_TEMP/ookla" speedtest
          qemu-arm-static "$RUNNER_TEMP/ookla/speedtest" --version | head -1

      - name: Test (mock CLI, service, UI end-to-end, official binary under QEMU)
        env:
          OOKLA_ARMEL_BIN: ${{ runner.temp }}/ookla/speedtest
          QEMU_ARM: /usr/bin/qemu-arm-static
        run: npm test

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./app/appinfo.json').version")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != appinfo $v"; exit 1; }

      - name: Package .ipk
        run: |
          npm run package
          cd dist && sha256sum *.ipk > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: |
            dist/*.ipk
            dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ipk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.ipk
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            Install with `ares-install` or Homebrew Channel. The Ookla CLI is **not** included:
            see the README ("Binary setup") to install it on the TV and accept its terms over SSH.
