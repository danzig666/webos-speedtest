name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
    # A pushed v* tag, or a manual run with "release" ticked (creates the tag).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # main hosts the Homebrew Channel repository index (homebrew/apps.json)
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: ipk
          path: dist

      - name: Generate Homebrew Channel repository files
        run: node scripts/make-homebrew-repo.js dist/*.ipk "${{ needs.build.outputs.tag }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Speedtest CLI ${{ needs.build.outputs.tag }}
          files: |
            dist/*.ipk
            dist/SHA256SUMS
            homebrew/*.manifest.json
          generate_release_notes: true
          body: |
            **Homebrew Channel:** Settings → Add repository →
            `https://raw.githubusercontent.com/danzig666/webos-speedtest/main/homebrew/apps.json`

            Or install the .ipk with `ares-install` or over SSH (see README). The Ookla CLI is **not** included:
            on first start the app elevates its service through Homebrew Channel, downloads the official
            CLI (SHA-256 pinned), and then shows Ookla's terms for you to accept.

      # Only after the release assets exist, so the index never points at a missing ipk.
      - name: Publish the repository index on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homebrew
          if git diff --cached --quiet; then echo "index unchanged"; exit 0; fi
          git commit -m "Homebrew repository: ${{ needs.build.outputs.tag }}"
          git push origin HEAD:main
