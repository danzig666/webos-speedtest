# Fully static binaries linked with the self-contained musl CRT; no
# cross gcc needed.
[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
[target.arm-unknown-linux-musleabi]
linker = "rust-lld"
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
